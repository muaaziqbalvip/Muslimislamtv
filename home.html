  <script>
    // Hide splash after 2 seconds then show choose
    document.addEventListener('DOMContentLoaded', function(){
      setTimeout(function(){
        const s = document.getElementById('splash');
        if(s) s.style.display = 'none';
        // show choose (already visible by default)
      }, 2000);
    });

    // Clock update
    function updateClock(){
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      const ss = String(now.getSeconds()).padStart(2,'0');
      document.getElementById('clock').textContent = hh+':'+mm+':'+ss;
    }
    setInterval(updateClock,1000); updateClock();

    // Battery display (if available)
    if(navigator.getBattery) navigator.getBattery().then(b=>{ function upd(){document.getElementById('battLevel').style.width = Math.round(b.level*100)+'%'}; upd(); b.addEventListener('levelchange',upd)})

    // Simple M3U parser
    function parseM3U(text){
      const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
      const items = [];
      for(let i=0;i<lines.length;i++){
        const l = lines[i];
        if(l.startsWith('#EXTINF')){
          const m = l.match(/#EXTINF:-?\d+\s*(.*),\s*(.*)/);
          let attrs = {};
          let name = '';
          if(m){
            name = m[2] || '';
            const attrStr = m[1];
            const attrRegex = /(\w[\w-]*)\s*=\s*"([^"]*)"/g;
            let am;
            while((am = attrRegex.exec(attrStr))!==null){ attrs[am[1]] = am[2]; }
          }
          let url='';
          for(let j=i+1;j<lines.length;j++){
            if(!lines[j].startsWith('#')){ url = lines[j]; break; }
          }
          items.push({name: name, url: url, logo: attrs['tvg-logo']||attrs['logo']||''});
        }
      }
      return items;
    }
function sortChannels(list) {
    const order = {
        "News": 1,
        "Entertainment": 2,
        "Kids": 3,
        "Education": 4
    };

    return list.sort((a, b) => {
        const catA = order[a.group] || 99;
        const catB = order[b.group] || 99;
        return catA - catB;
        
    });
}
    // Load m3u file and show channels
    async function loadM3U(file, countryName){
      try{
        const res = await fetch(file);
        if(!res.ok) throw new Error('Could not load playlist: '+res.status);
        const txt = await res.text();
        const channels = parseM3U(txt);
        document.getElementById('countryLabel').textContent = countryName + ' ('+channels.length+' channels)';
        renderChannels(channels);
        showPlayerView();
        if(channels.length) playStream(channels[0].url);
      }catch(err){
        alert('Error: '+err.message+'\nMake sure the .m3u file (p.m3u etc.) is in same folder and accessible.');
      }
    }

    function renderChannels(list){
      const grid = document.getElementById('channelsGrid'); grid.innerHTML='';
      list.forEach((ch,idx)=>{
        const div = document.createElement('div');
        div.className = 'channel color' + ((idx % 6) + 1);
        const img = document.createElement('img'); img.src = ch.logo || 'placeholder.png'; img.alt = ch.name;
        const nm = document.createElement('div'); nm.className='name'; nm.textContent = ch.name || ('Channel '+(idx+1));
        div.appendChild(img); div.appendChild(nm);
        div.addEventListener('click',()=>playStream(ch.url));
        grid.appendChild(div);
      })
    }

    function showPlayerView(){ document.getElementById('choose').classList.add('hidden'); document.getElementById('playerView').classList.remove('hidden'); }
    function showChoose(){ document.getElementById('choose').classList.remove('hidden'); document.getElementById('playerView').classList.add('hidden'); }

    // UPDATED: Back button event listener to clear playerContainer
    document.getElementById('back').addEventListener('click',()=>{ 
      showChoose(); 
      if(window.hls) { try{ window.hls.destroy(); }catch(e){} } 
      document.getElementById('playerContainer').innerHTML = ''; // Clear dynamic player
      document.getElementById('channelsGrid').innerHTML=''; 
    });

    // Country buttons
    document.querySelectorAll('.country').forEach(el=>{
      el.addEventListener('click',()=>{
        const file = el.getAttribute('data-file');
        const name = el.textContent.trim();
        loadM3U(file,name);
     
     })
    })

    // UPDATED: playStream function to support YouTube embeds
    function playStream(url){
        const playerContainer = document.getElementById('playerContainer');
        // Clear previous player/iframe
        playerContainer.innerHTML = ''; 
        if(window.hls) { try{ window.hls.destroy(); }catch(e){} }

        if(url.startsWith('YOUTUBE:')){
            // If it's a YouTube link
            const videoId = url.replace('YOUTUBE:', '').trim();
            const iframeHtml = `
                <iframe 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&controls=1&enablejsapi=1" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>`;
            
            playerContainer.innerHTML = iframeHtml;

        } else if (url) {
            // If it's a regular HLS/Video stream
            const videoElement = document.createElement('video');
            videoElement.controls = true;
            videoElement.playsInline = true;
            videoElement.id = 'playerVideo'; // Optional ID for the video element
            playerContainer.appendChild(videoElement);

            if(Hls.isSupported()){
                const hls = new Hls(); window.hls = hls;
                hls.loadSource(url);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { 
                    videoElement.play().catch(()=>{}); 
                });
            } else if(videoElement.canPlayType('application/vnd.apple.mpegurl')){
                videoElement.src = url; 
                videoElement.addEventListener('loadedmetadata',()=>videoElement.play().catch(()=>{}));
            } else {
                alert('Your browser does not support HLS playback.');
            }
        } else {
            alert('Stream URL not found');
        }
    }

<script>
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  installBtn.style.display = "none";
  deferredPrompt.prompt();
  const choice = await deferredPrompt.userChoice;
  deferredPrompt = null;
});
function filterChannels(){
    let q = document.getElementById("searchInput").value.toLowerCase();
    document.querySelectorAll(".channel").forEach(ch => {
        let name = ch.innerText.toLowerCase();
        ch.style.display = name.includes(q) ? "block" : "none";
    });
}
</script>
